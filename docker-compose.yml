# Optional: runs PostgreSQL only. Django and React run on your machine (see README).
# Credentials come from backend/.env (copy backend/.env.example first).
services:
  db:
    image: postgres:17-alpine
    env_file: backend/.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
